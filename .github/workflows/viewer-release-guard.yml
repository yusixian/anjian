name: Anjian checks
on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release PR head to check
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify dispatch identity
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: node scripts/release/version.mjs --check
      - run: node --test tests/release-checks/*.test.mjs tests/versioning/*.test.mjs
  artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Ensure ffmpeg and ffprobe
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Bound mirror failures and retain Ubuntu archive signature verification.
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            updated=false
            for mirror in https://mirrors.edge.kernel.org/ubuntu/ https://archive.ubuntu.com/ubuntu/; do
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              fi
              if sudo timeout --kill-after=5s 45s apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update; then
                updated=true
                break
              fi
              echo "Index update failed for $mirror; trying the next archive."
            done
            if [ "$updated" != true ]; then
              echo "No Ubuntu archive completed an index update." >&2
              exit 1
            fi
            sudo timeout --kill-after=5s 180s apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: pnpm test --maxWorkers 4
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
