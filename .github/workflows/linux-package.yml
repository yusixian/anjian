name: Linux packages
on:
  pull_request:
    paths:
      - .github/workflows/linux-package.yml
      - .github/workflows/release.yml
      - scripts/release/**
      - tests/systemd/user-service.sh
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: Package and test Linux on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          architecture: ${{ matrix.arch }}
          cache: pnpm
          cache-dependency-path: artifacts/pnpm-lock.yaml
      - run: pnpm --dir artifacts install --frozen-lockfile
      - run: pnpm --dir artifacts build
      - name: Verify the extracted package and its systemd user service
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          directory="$RUNNER_TEMP/anjian-packages"
          archive=$(node scripts/release/package-standalone.mjs "$directory" "$EXPECTED_SHA" "$TARGET_ARCH")
          node scripts/release/smoke-standalone-package.mjs "$archive" "$EXPECTED_SHA" "$TARGET_ARCH"
          bash tests/systemd/user-service.sh "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: anjian-standalone-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/anjian-packages/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
